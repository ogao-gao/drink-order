<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b4d">
<meta name="description" content="会合用ドリンク注文集計アプリ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>ドリンク注文集計</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#17231e;background:#f4f7f5}
*{box-sizing:border-box}body{margin:0;padding:20px 14px 36px;max-width:620px;margin-inline:auto}
header{margin:8px 2px 20px}h1{font-size:25px;margin:0 0 5px}header p{margin:0;color:#63736b;font-size:13px}
.panel{background:white;border:1px solid #e0e9e3;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #153b2710}
.section-title{font-weight:750;margin:0 0 12px}
.item{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #edf1ee;gap:10px}
.item:last-child{border:0}.drink{font-weight:650}.controls{display:flex;align-items:center;gap:13px}
.count{font-size:21px;font-weight:750;min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
button{border:0;cursor:pointer;font:inherit}
.step{width:42px;height:42px;border-radius:13px;background:#eaf2ed;color:#176b4d;font-size:25px;font-weight:600}
.step:active,.primary:active{transform:scale(.97)}
.total{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.total strong{font-size:30px;color:#176b4d}
.summary-row{display:flex;justify-content:space-between;padding:7px 0;font-size:15px}
.actions{display:grid;gap:9px;margin-top:14px}
.primary,.secondary,.reset{border-radius:13px;padding:13px;font-weight:700}
.primary{background:#176b4d;color:white}.secondary{background:#eaf2ed;color:#176b4d}.reset{background:#fff0ef;color:#a33b32}
.note{font-size:12px;color:#748078;line-height:1.6;margin:10px 2px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17231e;color:white;padding:10px 16px;border-radius:30px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header><h1>☕ ドリンク注文集計</h1><p>参加者に聞きながら「＋」「−」で数量を入力できます。</p></header>
<section class="panel">
 <h2 class="section-title">飲み物の数量</h2>
 <div id="items"></div>
</section>
<section class="panel">
 <div class="total"><span>合計注文数</span><strong><span id="total">0</span> 杯</strong></div>
</section>
<section class="panel">
 <h2 class="section-title">コンビニ購入リスト</h2>
 <div id="summary"><p class="note">数量を入力すると、ここに購入リストが表示されます。</p></div>
 <div class="actions">
  <button class="primary" id="copy">購入リストをコピー</button>
  <button class="secondary" id="share">共有する</button>
  <button class="reset" id="reset">すべて 0 に戻す</button>
 </div>
</section>
<p class="note">※入力内容はこの端末のブラウザ内に保存されます。次回開いたときも残ります。同じ端末・同じブラウザでご利用ください。</p>
<div class="toast" id="toast"></div>
<script>
const drinks=["ホットコーヒー","アイスコーヒー","ホットラテ","アイスラテ","ホットティー","アイスティー"];
let counts=JSON.parse(localStorage.getItem("drinkCounts")||"null");
if(!Array.isArray(counts)||counts.length!==drinks.length) counts=drinks.map(()=>0);
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("drinkCounts",JSON.stringify(counts));render()}
function render(){
 $("items").innerHTML=drinks.map((d,i)=>`<div class="item"><span class="drink">${d}</span><div class="controls"><button class="step" aria-label="${d}を1杯減らす" data-i="${i}" data-d="-1">−</button><span class="count">${counts[i]}</span><button class="step" aria-label="${d}を1杯増やす" data-i="${i}" data-d="1">＋</button></div></div>`).join("");
 const total=counts.reduce((a,b)=>a+b,0);$("total").textContent=total;
 const active=drinks.map((d,i)=>({d,n:counts[i]})).filter(x=>x.n>0);
 $("summary").innerHTML=active.length?active.map(x=>`<div class="summary-row"><span>${x.d}</span><strong>${x.n} 杯</strong></div>`).join(""):'<p class="note">数量を入力すると、ここに購入リストが表示されます。</p>';
 document.querySelectorAll("[data-i]").forEach(b=>b.addEventListener("click",()=>{const i=Number(b.dataset.i),delta=Number(b.dataset.d);counts[i]=Math.max(0,counts[i]+delta);save()}));
}
function listText(){return "ドリンク購入リスト\\n"+drinks.map((d,i)=>`${d}：${counts[i]}杯`).join("\\n")+"\\n合計："+counts.reduce((a,b)=>a+b,0)+"杯"}
function toast(msg){$("toast").textContent=msg;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(listText());toast("購入リストをコピーしました")}catch(e){toast("コピーできませんでした。共有をご利用ください")}});
$("share").addEventListener("click",async()=>{if(navigator.share){try{await navigator.share({title:"ドリンク購入リスト",text:listText()})}catch(e){}}else{try{await navigator.clipboard.writeText(listText());toast("共有に対応していないためコピーしました")}catch(e){toast("共有に対応していません")}}});
$("reset").addEventListener("click",()=>{if(confirm("すべての数量を0に戻しますか？")){counts=drinks.map(()=>0);save();toast("数量をリセットしました")}});
render();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body></html>
